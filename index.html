<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071411">
  <meta name="description" content="DroAIVC 节水抗旱虚拟细胞数据门户：21 个物种的单细胞转录组图谱、干旱响应预测、动态轨迹、基因网络与扰动效应。">
  <title>DroAIVC · 节水抗旱虚拟细胞</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%2338e0b0'/%3E%3Cstop offset='1' stop-color='%230f8f7a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23g)' d='M32 5C23 18 13 27 13 39a19 19 0 0 0 38 0C51 27 41 18 32 5Z'/%3E%3Ccircle cx='32' cy='40' r='7' fill='%23071411' opacity='.55'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/style.css?v=20261030h">
</head>
<body>
  <div class="bg-aurora" aria-hidden="true"></div>
  <header id="topbar" class="topbar"></header>
  <main id="view" class="view" tabindex="-1">
    <div class="boot">
      <div class="boot-drop"></div>
      <p>正在载入 DroAIVC 数据门户…</p>
    </div>
  </main>
  <footer class="footer">
    <div class="footer-inner">
      <div>
        <strong>DroAIVC</strong>
        <span>节水抗旱虚拟细胞 · 21 物种单细胞图谱与干旱响应预测</span>
      </div>
      <div class="footer-meta">
        <span id="footer-generated"></span>
        <a href="#/methods">数据与方法</a>
      </div>
    </div>
  </footer>

  <div id="lightbox" class="lightbox" aria-hidden="true" role="dialog" aria-label="图件查看器">
    <div class="lb-backdrop" data-close-lightbox></div>
    <div class="lb-shell">
      <header class="lb-head">
        <div class="lb-title-wrap">
          <div id="lb-kicker" class="lb-kicker"></div>
          <h2 id="lb-title" class="lb-title"></h2>
        </div>
        <div class="lb-actions">
          <button class="icon-btn" id="lb-zoom-out" data-action="lb-zoom-out" title="缩小 (-)" aria-label="缩小">−</button>
          <button class="icon-btn" id="lb-zoom-in" data-action="lb-zoom-in" title="放大 (+)" aria-label="放大">+</button>
          <button class="icon-btn" id="lb-reset" data-action="lb-reset" title="适应窗口 (0)" aria-label="适应窗口">1:1</button>
          <button class="icon-btn" id="lb-close" data-action="lb-close" title="关闭 (Esc)" aria-label="关闭">✕</button>
        </div>
      </header>
      <div class="lb-body">
        <div class="lb-stage" id="lb-stage">
          <div class="lb-nav">
            <button class="icon-btn lb-prev" id="lb-prev" data-action="lb-prev" title="上一张 (←)" aria-label="上一张">‹</button>
            <button class="icon-btn lb-next" id="lb-next" data-action="lb-next" title="下一张 (→)" aria-label="下一张">›</button>
          </div>
          <div id="lb-media" class="lb-media"></div>
        </div>
        <aside class="lb-info">
          <div id="lb-meta" class="lb-meta"></div>
          <div id="lb-caption" class="lb-caption"></div>
          <div id="lb-method" class="lb-detail" hidden>
            <h4>方法</h4>
            <p class="lb-detail-body"></p>
          </div>
          <div id="lb-result" class="lb-detail result" hidden>
            <h4>生物学结论</h4>
            <p class="lb-detail-body"></p>
          </div>
          <div id="lb-hint" class="lb-hint">滚轮缩放 · 拖动平移 · 双击切换 1× / 2×</div>
          <div id="lb-source-wrap" class="lb-source-wrap"></div>
          <div id="lb-formats" class="lb-formats"></div>
          <button id="lb-copy" class="btn tiny ghost" data-action="lb-copy">复制图片路径</button>
          <div class="lb-counter" id="lb-counter"></div>
        </aside>
      </div>
    </div>
  </div>

  <div id="command" class="command" aria-hidden="true" role="dialog" aria-label="全局搜索">
    <div class="command-backdrop" data-close-command></div>
    <div class="command-panel">
      <div class="command-input-wrap">
        <svg viewBox="0 0 24 24" class="search-icon" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 1 0 4.7 13.3L20 21l1-1-4.8-4.8A7.5 7.5 0 0 0 10.5 3Zm0 2a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11Z" fill="currentColor"/></svg>
        <input id="command-input" type="search" placeholder="搜索图件、物种、分析模块…  Ctrl / ⌘ K" autocomplete="off">
        <kbd>Esc</kbd>
      </div>
      <div id="command-results" class="command-results"></div>
      <div class="command-foot">支持中文图注、物种名、模块名与文件名检索</div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="tooltip" class="tooltip" role="tooltip"></div>
  <script src="assets/js/app.js?v=20261030h" defer></script>
</body>
</html>
